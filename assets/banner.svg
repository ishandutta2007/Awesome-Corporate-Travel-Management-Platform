<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#311042" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <linearGradient id="planeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    @keyframes flightPath {
      0% { stroke-dashoffset: 1000; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes floatPlane {
      0% { transform: translate(0px, 0px) rotate(0deg); }
      50% { transform: translate(15px, -10px) rotate(2deg); }
      100% { transform: translate(0px, 0px) rotate(0deg); }
    }
    @keyframes pulseCard {
      0%, 100% { opacity: 0.15; transform: scale(1); }
      50% { opacity: 0.25; transform: scale(1.02); }
    }
    .flight-line {
      stroke-dasharray: 10 15;
      animation: flightPath 20s linear infinite;
    }
    .plane-container {
      animation: floatPlane 4s ease-in-out infinite;
    }
    .bg-card {
      animation: pulseCard 6s ease-in-out infinite;
      transform-origin: center;
    }
  </style>

  <!-- Background -->
  <rect width="1200" height="300" rx="16" fill="url(#bgGrad)" />

  <!-- Background Subtle Grid/Network Lines (Dynamic Background Element) -->
  <g opacity="0.12" stroke="#ffffff" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="300" />
    <line x1="300" y1="0" x2="300" y2="300" />
    <line x1="500" y1="0" x2="500" y2="300" />
    <line x1="700" y1="0" x2="700" y2="300" />
    <line x1="900" y1="0" x2="900" y2="300" />
    <line x1="1100" y1="0" x2="1100" y2="300" />
    <line x1="0" y1="60" x2="1200" y2="60" />
    <line x1="0" y1="150" x2="1200" y2="150" />
    <line x1="0" y1="240" x2="1200" y2="240" />
  </g>

  <!-- Decorative Background Glow Shapes -->
  <circle cx="1050" cy="80" r="180" fill="#818cf8" opacity="0.15" filter="url(#glow)" />
  <circle cx="150" cy="220" r="140" fill="#38bdf8" opacity="0.12" filter="url(#glow)" />

  <!-- Dynamic Flight Path Curve -->
  <path class="flight-line" d="M -50 240 Q 300 40, 600 180 T 1250 80" fill="none" stroke="url(#accentGrad)" stroke-width="3" opacity="0.6" />

  <!-- Animated Airplane Icon in Top Right Corner -->
  <g class="plane-container" transform="translate(980, 50)">
    <path d="M21 16v-2l-8-5V3.5c0-.83-.67-1.5-1.5-1.5S10 2.67 10 3.5V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5l8 2.5z" fill="url(#planeGrad)" transform="scale(2.2) rotate(45)" filter="url(#glow)" />
  </g>

  <!-- Foreground Title and Subtitle (Crisp, Clear, Elevated) -->
  <g transform="translate(80, 115)">
    <!-- Sub-badge / Header tag -->
    <rect x="0" y="-45" width="340" height="28" rx="14" fill="#38bdf8" opacity="0.18" />
    <text x="15" y="-26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#38bdf8" letter-spacing="1.5">CURATED ENTERPRISE ECOSYSTEM</text>
    
    <!-- Main Title -->
    <text x="0" y="25" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="800" fill="#ffffff" letter-spacing="-0.5">
      Awesome Corporate Travel
    </text>
    <text x="0" y="70" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="800" fill="url(#accentGrad)" letter-spacing="-0.5">
      Management Platform ✈️
    </text>

    <!-- Subtitle -->
    <text x="0" y="112" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#94a3b8" letter-spacing="0.2">
      SaaS Solutions • Open-Source Tools • Expense Integration • Policy Enforcement &amp; Duty of Care
    </text>
  </g>
</svg>
